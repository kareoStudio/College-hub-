name: Build College Hub APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      
      - name: Install Gradle 8.14.2
        run: |
          sudo rm -rf /usr/share/gradle-*
          wget -q https://services.gradle.org/distributions/gradle-8.14.2-bin.zip
          unzip -q gradle-8.14.2-bin.zip
          sudo mv gradle-8.14.2 /opt/gradle-8.14.2
          sudo ln -sf /opt/gradle-8.14.2/bin/gradle /usr/local/bin/gradle
          gradle --version
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Setup Cordova Project & Copy Files
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Create project with matching package name
          cordova create college-hub com.kareostudio "College Hub"
          
          # 2. Copy config.xml and icon
          cp config.xml college-hub/config.xml

          # 2b. Firebase config for push notifications
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > college-hub/google-services.json
            echo "google-services.json loaded from secret"
          elif [ -f google-services.json ]; then
            cp google-services.json college-hub/google-services.json
            echo "google-services.json loaded from repo"
          else
            echo "::error::google-services.json NOT FOUND. Add secret GOOGLE_SERVICES_JSON (base64) or commit google-services.json in repo root."
            exit 1
          fi
          mkdir -p college-hub/res
          [ -f icon.png ] && cp icon.png college-hub/res/icon.png || echo "icon.png not found, skipping"
          
          # 3. Copy index.html and main.html
          cp index.html college-hub/www/index.html
          [ -f main.html ] && cp main.html college-hub/www/main.html || echo "main.html not present"
          
          cd college-hub
          cordova platform add android@14.0.0
          
          # 4. Plugins required for College Hub
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-network-information
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-filepath
          cordova plugin add cordova-plugin-filechooser
          cordova plugin add cordova-plugin-android-permissions

          # 5. Push notifications plugin
          cordova plugin add cordova-plugin-firebasex --save
          echo "=== Installed plugins ==="
          cordova plugin ls
          cordova plugin ls | grep -q "firebasex" || { echo "::error::firebasex plugin missing"; exit 1; }
          
          echo "=== www files copied ==="
          ls -la www/
  
      - name: Prepare and Build Release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cd college-hub
          
          # 1. google-services.json ko correct native Android location par copy karein
          mkdir -p platforms/android/app
          cp google-services.json platforms/android/app/google-services.json || true
          cp google-services.json platforms/android/google-services.json || true
          
          # 2. Release APK build karein
          cordova build android --release -- --packageType=apk
          
          # Keystore aur Signing
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            STOREPASS="$KEYSTORE_PASS"
            echo "Using fixed keystore from secrets"
          else
            echo "WARNING: no KEYSTORE secrets - generating a temporary keystore (APK signature will change every build)"
            STOREPASS="123456"
            keytool -genkeypair -v -keystore release.keystore -alias collegehub -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=CollegeHub, OU=Kareo, O=KareoStudio, L=Bareilly, S=UP, C=IN"
          fi
          
          UNSIGNED_APK="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="platforms/android/app/build/outputs/apk/release/app-aligned.apk"
          SIGNED_APK="platforms/android/app/build/outputs/apk/release/CollegeHub-release.apk"
          
          $ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner sign --ks release.keystore --ks-pass pass:"$STOREPASS" --key-pass pass:"$STOREPASS" --out "$SIGNED_APK" "$ALIGNED_APK"
          
          # SHA-1 print
          keytool -list -v -keystore release.keystore -alias collegehub -storepass "$STOREPASS" | grep "SHA1:"




      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: College-Hub-Release-APK
          path: college-hub/platforms/android/app/build/outputs/apk/release/CollegeHub-release.apk

      - name: Upload to Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: college-hub/platforms/android/app/build/outputs/apk/release/CollegeHub-release.apk
          tag_name: v1.0.2-${{ github.run_number }}
          name: College Hub v1.0.2 Release ${{ github.run_number }}
          body: |
            ## College Hub Official Release APK
            - App Name: College Hub
            - Package: com.kareostudio
            - Target SDK: 34 (Android 14)
            - Build Type: Production Release (Signed)
            - Build Date: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
