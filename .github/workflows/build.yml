name: Build College Hub APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android Build Tools 33.0.2
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          sdkmanager --list | grep "build-tools"
      
      - name: Install Gradle 7.6
        run: |
          sudo rm -rf /usr/share/gradle-*
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip
          sudo mv gradle-7.6 /opt/gradle-7.6
          sudo ln -sf /opt/gradle-7.6/bin/gradle /usr/local/bin/gradle
          gradle --version
      
      - name: Install Cordova
        run: npm install -g cordova
      
      # IMPORTANT: Pehle files copy karo, phir platform add karo!
      - name: Setup Cordova Project & Copy Files
        run: |
          cordova create college-hub com.kareostudeo "College Hub"
          
          # Pehle config copy karo
          cp config.xml college-hub/config.xml
          
          # HTML files copy karo
          cp index.html college-hub/www/index.html
          
          # Icon ke liye folder banao
          mkdir -p college-hub/res
          cp icon.png college-hub/res/icon.png || echo "icon.png not found, skipping"
          
          # Ab platform add karo - tabhi manifest sahi banega
          cd college-hub
          cordova platform add android@12.0.1
          
          echo "=== www folder ==="
          ls -la www/
          echo "=== res folder ==="
          ls -la res/
      
      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd college-hub
          cordova build android --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: College-Hub-APK
          path: college-hub/platforms/android/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Upload to Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          files: college-hub/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: College Hub v1.0.0 Build ${{ github.run_number }}
          body: |
            ## College Hub APK
            - App Name: College Hub
            - Package: com.kareostudeo
            - Build Date: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
