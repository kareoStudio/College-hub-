name: Create Keystore (run ONCE)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and save as repo secrets
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret ADMIN_PAT missing. Create a fine-grained token with Secrets: Read and write and save it as ADMIN_PAT."
            exit 1
          fi

          PASS=$(openssl rand -hex 16)

          keytool -genkeypair -keystore release.keystore -alias collegehub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=CollegeHub, OU=Kareo, O=KareoStudio, L=Bareilly, S=UP, C=IN"

          base64 -w0 release.keystore > ks.b64

          gh secret set KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < ks.b64
          printf '%s' "$PASS" | gh secret set KEYSTORE_PASS --repo "$GITHUB_REPOSITORY"

          echo "Done: KEYSTORE_B64 and KEYSTORE_PASS saved as secrets."
